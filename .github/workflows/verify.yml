name: Verify public source and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official tag
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit public source
        run: python tools/public_audit.py --source
      - name: Test management and save protection
        run: python -m unittest discover -s ConvictionEnhanced/tests -p "test_*.py"
      - name: Build x86 release and isolated native hosts
        shell: cmd
        run: call ConvictionEnhanced\native\build.cmd
      - name: Run CPU/native-host fixtures
        run: python tools/run_native_tests.py
      - name: Build and audit public release archive
        run: |
          python ConvictionEnhanced/package.py
          python tools/public_audit.py --zip ConvictionEnhanced/dist/Michael-Works-Splinter-Cell-Conviction-Mod-0.8.4.zip
      - name: Build standalone installer with verified dependencies
        shell: pwsh
        run: |
          $buildEnv = Join-Path $env:RUNNER_TEMP 'mw-mod-standalone-env'
          python -m venv $buildEnv
          if ($LASTEXITCODE -ne 0) { throw 'Standalone build environment failed' }
          $buildPython = Join-Path $buildEnv 'Scripts/python.exe'
          & $buildPython -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r tools/standalone-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned standalone dependencies failed verification' }
          & $buildPython tools/build_standalone.py --work-dir (Join-Path $env:RUNNER_TEMP 'mw-mod-standalone-build')
          if ($LASTEXITCODE -ne 0) { throw 'Standalone build or embedded audit failed' }
      - name: Verify standalone without Python or a game
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'ConvictionEnhanced/dist/Michael-Works-Splinter-Cell-Conviction-Mod-Setup-0.8.4.exe').Path
          $report = Join-Path $env:RUNNER_TEMP 'standalone-self-check.json'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:\PYTHONHOME, Env:\PYTHONPATH -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-check', ('"' + $report + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Standalone self-check failed' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.ok -ne $true -or $result.distribution_version -ne '0.8.4') { throw 'Standalone self-check report invalid' }
          $fixture = Join-Path $env:RUNNER_TEMP 'mw-mod-empty-game'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $uiReport = Join-Path $env:RUNNER_TEMP 'standalone-ui-self-check.json'
          $ui = Start-Process -FilePath $exe -ArgumentList @('--ui-self-check', ('"' + $uiReport + '"'), '--game', ('"' + $fixture + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($ui.ExitCode -ne 0) { throw 'Standalone interface self-check failed' }
          $uiResult = Get-Content -LiteralPath $uiReport -Raw | ConvertFrom-Json
          if ($uiResult.ok -ne $true) { throw 'Standalone interface self-check report invalid' }
      - name: Upload reviewed build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: michael-works-mod-0.8.4-windows
          path: |
            ConvictionEnhanced/dist/*.zip
            ConvictionEnhanced/dist/*.sha256
            ConvictionEnhanced/dist/*Setup-*.exe
            ConvictionEnhanced/dist/*Setup-*.exe.json
          if-no-files-found: error
          retention-days: 14

# Hosted runners validate CPU fixtures. The D3D9/controller harness and live
# campaign/Deniable Ops acceptance require a local Windows graphics session.
